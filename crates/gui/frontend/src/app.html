<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/yomi.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        // Apply the cached color theme pre-paint (mirrored by the themes
        // module on every apply). Without a cache the app boots light and
        // the settings module applies the real theme right after load.
        try {
          var cache = JSON.parse(
            localStorage.getItem("yomi-gui-active-theme") || "null",
          );
          if (cache && cache.vars) {
            if (cache.dark) {
              document.documentElement.classList.add("dark");
            }
            var style = document.documentElement.style;
            for (var name in cache.vars) {
              style.setProperty(name, cache.vars[name]);
            }
          }
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <script>
      if (window.__TAURI_INTERNALS__) {
        try {
          const label = window.__TAURI_INTERNALS__.metadata.currentWindow.label;
          if (label === "pet") {
            document.documentElement.classList.add("pet-window");
            document.body.classList.add("pet-window");
          }
        } catch (e) {}
      }
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
