[package]
name = "yomi-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Tauri v2
tauri = { workspace = true, features = ["devtools", "macos-private-api"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tokio-util = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
image = { workspace = true, features = ["webp"] }

# Config TOML editing
toml = { workspace = true }
tempfile = { workspace = true }

# Daemon lifecycle (shared with CLI)
directories = { workspace = true }

# Terminal
portable-pty = { workspace = true }

# Internal crate — zero modifications to kernel
kernel = { workspace = true }
async-trait = { workspace = true }

# tauri-pilot plugin (debug builds only)
tauri-plugin-pilot = { workspace = true }
tauri-plugin-notification = { workspace = true }

# Fix PATH for GUI apps (macOS / Linux / Windows)
fix-path-env = { workspace = true }

# rustls crypto provider (required before any TLS operations)
rustls = { workspace = true, features = ["ring"] }

# Load ~/.env on startup
dotenvy = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
