[package]
name = "kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
blake3 = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
rand = { workspace = true }

lark-websocket-protobuf = { workspace = true }

prost = { workspace = true }

tokio-util = { workspace = true }
futures = { workspace = true, features = ["std"] }
smol_str = { workspace = true, features = ["serde"] }
serde_yaml = { workspace = true }
toml = { workspace = true }

reqwest = { workspace = true }
eventsource-stream = { workspace = true }
sqlx = { workspace = true }
arc-swap = { workspace = true }

# Tool dependencies
regex = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
base64 = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "gif", "webp"] }
lru = { workspace = true }
html2text = { workspace = true }
urlencoding = { workspace = true }
scraper = { workspace = true }
duckduckgo = { workspace = true }
directories = { workspace = true }

# Task system dependencies
# Note: fs4 removed - using SQLite instead of file-based storage
dashmap = { workspace = true }

tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-native-roots"] }
cron = { workspace = true }
mime_guess = { workspace = true }
teloxide-core = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
rustls = { workspace = true, features = ["ring"] }
tokio-test = { workspace = true }
tempfile = { workspace = true }
