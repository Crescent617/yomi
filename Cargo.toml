[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.5.6"
edition = "2021"
authors = ["Huaru Li <crescent617@outlook.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/Crescent617/yomi"

[workspace.lints.clippy]
needless_raw_string_hashes = "allow"
option_if_let_else = "allow"

[workspace.dependencies]
# Core deps
tokio = { version = "1.51", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

ulid = "1.2"

# TUI deps
crossterm = { version = "0.29", features = ["bracketed-paste"] }
pulldown-cmark = "0.13"

# CLI deps
clap = { version = "4.6", features = ["derive"] }
config = "0.15"
tracing-subscriber = "0.3"

reqwest = { version = "0.13", features = ["stream", "json", "multipart"] }
eventsource-stream = "0.2"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "migrate",
    "chrono",
] }
futures = "0.3"
toml = "1.1"

# Internal - renamed for generic use in code
kernel = { path = "crates/kernel", package = "kernel" }
tui = { path = "crates/tui", package = "tui" }
directories = "6.0"
md5 = "0.8"
rand = "0.10"
serde_yaml = "0.9"
smol_str = "0.3"
tempfile = "3.0"
tokio-test = "0.4"
tracing-appender = "0.2"
comfy-table = "7.2"
tui-realm-stdlib = "4.0"
tuirealm = "4.0"
unicode-width = "0.2"
arboard = { version = "3.3", default-features = false }
arc-swap = "1"
base64 = "0.22"
globset = "0.4"
ignore = "0.4"
image = { version = "0.25", default-features = false }
regex = "1"
lru = "0.18"
html2text = "0.17"
scraper = "0.27"
urlencoding = "2.1"
dashmap = "6.1"
nucleo = "0.5"
tokio-tungstenite = "0.29"
cron = "0.16"
duckduckgo = { version = "0.3", default-features = false }
mime_guess = "2"
teloxide-core = "0.10"
notify-rust = "4.11"
# Pin time to 0.3.47 to avoid E0119 conflict with mac-notification-sys blanket `From` impl.
# time 0.3.48 added `From<HourBase>` which conflicts with `impl<I: ToString> From<I> for Sound`.
# See: https://github.com/time-rs/time/issues/783
time = "=0.3.47"
blake3 = "1.5"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d50" }
portable-pty = "0.9"
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-pilot = { git = "https://github.com/mpiton/tauri-pilot", default-features = false }
tauri-plugin-store = "2"
dotenvy = "0.15"
