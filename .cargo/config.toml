[target.'cfg(all())']
rustflags = [
    "-W",
    "clippy::all",
    "-W",
    "clippy::pedantic",
    # "-W", "clippy::nursery",
    # 允许的 lint (不太重要或会产生太多误报)
    "-A",
    "clippy::module_name_repetitions",
    "-A",
    "clippy::too_many_lines",
    "-A",
    "clippy::must_use_candidate",
    "-A",
    "clippy::missing_errors_doc",
    "-A",
    "clippy::missing_panics_doc",
    "-A",
    "clippy::cast_sign_loss",
    "-A",
    "clippy::cast_possible_truncation",
    "-A",
    "clippy::cast_possible_wrap",
    "-A",
    "clippy::single_match_else",
    "-A",
    "clippy::manual_is_multiple_of",
    "-A",
    "clippy::redundant_closure_for_method_calls",
    "-A",
    "clippy::used_underscore_binding",
    "-A",
    "clippy::unused_async",
    "-A",
    "clippy::no_effect_underscore_binding",
    "-A",
    "clippy::similar_names",
    "-A",
    "clippy::struct_field_names",
    "-A",
    "clippy::manual_let_else",
    "-A",
    "clippy::default-trait-access",
]

[registries.crates-io]
protocol = "sparse"

[profile.release]
# thin LTO + 默认并行 codegen 单元：fat LTO + cg=1 的链接期单线程
# 全程序代码生成是 Windows 构建 33min 的主因（MSVC link.exe 尤其
# 慢），yomi 是 IO/模型延迟主导的 agent 应用，fat LTO 的 CPU 收益
# 无感——编译时间换性能不划算（2026-09-29 拍板）。
lto = "thin"
strip = true
