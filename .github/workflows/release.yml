name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ==================== 前置检查 ====================
  check-precondition:
    name: Check Precondition
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check HOMEBREW_TAP_TOKEN
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "❌ ERROR: HOMEBREW_TAP_TOKEN is not set!" >&2
            echo "  Please add it to Repository secrets at: Settings → Secrets and variables → Actions → Repository secrets" >&2
            exit 1
          fi
          echo "✅ HOMEBREW_TAP_TOKEN is set (length: ${#HOMEBREW_TAP_TOKEN})"

  # ==================== 先行创建 Release ====================
  # 各构建 job 完成后随即向此 release 上架自己的产物（即建即发：
  # mac 编译完不用等 Windows）；缺失产物由 audit 收尾标注。
  create-release:
    name: Create Release
    needs: check-precondition
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # 从 CHANGELOG.md 抽取本版本 section 作为 GitHub Release 的 release note
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: bash ./scripts/extract-release-notes.sh "${GITHUB_REF_NAME#v}" release-notes.md

      # 无 notes 硬拦：忘写 CHANGELOG section 的 tag 不发出去（补写后
      # 删 tag 重推即可）；只 warning 会产出没有说明的裸 release。
      - name: Gate on non-empty release notes
        run: |
          if [ ! -s release-notes.md ]; then
            echo "❌ CHANGELOG.md has no [${GITHUB_REF_NAME#v}] section; add it and re-push the tag" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

  # ==================== Linux 构建 ====================
  # linux 的 CLI 资产与 docker 镜像同源于这一个 job：编一次二进制，
  # 先发 tar.gz 上架（asset 优先于镜像，镜像 push 失败不影响 CLI
  # 发布），再打包推 GHCR。三个 OS 的 job 各自编译、各自上架自己
  # 的全部产物，互不干扰；audit 收尾清点。
  build-linux:
    name: Build CLI & Docker (linux)
    needs: [check-precondition, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Linux 用 clang 避坑 aws-lc
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build
        shell: bash
        run: CC=clang CXX=clang++ cargo build --release --target x86_64-unknown-linux-gnu --bin yomi

      - name: Package & upload CLI asset
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          OUT="yomi-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "$OUT"
          cp "target/x86_64-unknown-linux-gnu/release/yomi" "$OUT/"
          tar czf "$OUT.tar.gz" "$OUT"

      # 即建即发（softprops 按 tag 找 create-release 已建的 release
      # 追加 asset，重传覆盖默认开启）。
      - uses: softprops/action-gh-release@v2
        with:
          files: yomi-*-x86_64-unknown-linux-gnu.tar.gz

      # ---- docker 镜像（复用上面编出的二进制，不再用 nix 从头编译）----

      - name: Prepare build context
        run: |
          set -euo pipefail
          cp target/x86_64-unknown-linux-gnu/release/yomi docker/yomi
          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${OWNER}/yomi" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        env:
          # 不上传 buildx 构建记录 artifact（0 字节、无法解 zip，
          # 会把 release job 的全量 artifact 下载搞挂）
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: docker
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          # apt 工具链层跨 run 缓存；yomi 层每次新发
          cache-from: type=gha,scope=yomi-docker
          cache-to: type=gha,mode=max,scope=yomi-docker

  # ==================== macOS 构建 ====================
  # mac 的全部产物（DMG + CLI tar.gz，sidecar 同源）在本 job 编译上架。
  build-osx:
    name: Build macOS (DMG + CLI)
    needs: [check-precondition, create-release]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            crates/gui/package-lock.json
            crates/gui/frontend/package-lock.json

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # frontend 构建（node/vite）与 CLI 编译（cargo）互不依赖、产
      # 物目录不相交——同 runner 后台并行，两份 wall 叠成一份。
      # tauri build 的 generate_context! 在 codegen 时嵌入
      # frontendDist，故进入 DMG 步前必须 wait 前端就绪（失败也在
      # 烧 rust 编译时间前快速退出）。
      - name: Build CLI sidecar + frontend (concurrent)
        shell: bash
        run: |
          set -euo pipefail
          (cd crates/gui/frontend && npm ci && npm run build) &
          FE_PID=$!
          bash scripts/bundle-cli-sidecar.sh aarch64-apple-darwin
          wait $FE_PID || { echo "frontend build failed"; exit 1; }

      # CLI tar.gz 与 sidecar 同源：同一 target dir 一次编译，此处
      # 只打包不上编译（原 build-tui macOS leg 的重复全量编译已删）。
      - name: Package & upload CLI asset
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          OUT="yomi-${VERSION}-aarch64-apple-darwin"
          mkdir -p "$OUT"
          cp target/release/yomi "$OUT/"
          tar czf "$OUT.tar.gz" "$OUT"

      - uses: actions/upload-artifact@v6
        with:
          name: aarch64-apple-darwin
          path: yomi-*-aarch64-apple-darwin.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          files: yomi-*-aarch64-apple-darwin.tar.gz

      - name: Build & Sign DMG
        working-directory: crates/gui
        run: |
          npm ci
          npx tauri build --config '{"build":{"beforeBuildCommand":""}}'
          bash ../../scripts/fix-dmg-signature.sh

      - name: Calculate SHA256
        id: sha
        run: |
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: gui-dmg
          path: ${{ steps.sha.outputs.dmg }}

      # 即建即发：DMG 随即上架（此时 Windows 产物可能还在构建）。
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sha.outputs.dmg }}

  # ==================== Windows 构建 ====================
  # 与 windows-e2e.yml 的手动打包共用 .github/workflows/build-windows.yml
  # 单一定义；产物由 reusable 内 release-upload 步骤即建即发（省掉原
  # 聚合下载转发 job），windows-e2e 不传 release-upload 只验证打包。
  build-windows:
    name: Build Windows (msi + CLI)
    needs: [check-precondition, create-release]
    permissions:
      contents: write
    uses: ./.github/workflows/build-windows.yml
    with:
      release-upload: true

  # ==================== 收尾清点 ====================
  # 全部构建结束后清点 release 资产：缺失名单重写进 notes（从
  # CHANGELOG 重抽干净 notes 再追加——retry 补齐产物后 notes 自动
  # 恢复干净）。产物本身已由各构建 job 即建即发。
  audit:
    name: Audit release assets
    needs: [build-linux, build-osx, build-windows]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Report missing assets into release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          EXPECTED=(
            "yomi-${VERSION}-aarch64-apple-darwin.tar.gz"
            "yomi-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "yomi-${VERSION}-x86_64-pc-windows-msvc.zip"
            "Yomi_${VERSION}_aarch64.dmg"
            "Yomi_${VERSION}_x64_en-US.msi"
          )
          ASSETS=$(gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          MISSING=()
          for f in "${EXPECTED[@]}"; do
            if grep -qx "$f" <<< "$ASSETS"; then
              echo "present: $f"
            else
              echo "::warning::missing asset: $f"
              MISSING+=("$f")
            fi
          done
          bash ./scripts/extract-release-notes.sh "$VERSION" release-notes.md
          if [ ${#MISSING[@]} -gt 0 ]; then
            {
              echo ""
              echo "---"
              echo "⚠️ 本次发布缺少以下产物（对应构建 job 失败；修复后 re-run failed 会自动补齐并刷新本说明）："
              for f in "${MISSING[@]}"; do echo "- \`$f\`"; done
            } >> release-notes.md
          fi
          gh release edit "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --notes-file release-notes.md

  # ==================== 更新 Homebrew（formula + cask） ====================
  # formula（mac CLI tar.gz gate）与 cask（DMG gate）同一 job 内顺序
  # 执行；两者皆纯 mac 产物（同出 build-osx），needs 只挂 build-osx。
  # 跨 job 拆开的唯一理由是提前 formula，但拆分后仍要等 build-osx，
  # 提前量为零，只剩 tap push 冲突风险——不如合 job。always() 保证上游失败也来试；gate 一律硬拦（exit 1）——
  # warning 跳过会静默漏发（v0.10.53 formula 漏发即此因，靠人工对
  # tap 版本才发现）；产物缺失属真故障，红了可见，re-run 即恢复。
  brew:
    name: Release to Homebrew
    # 同一 tap repo 全局串行：两次 release run 重叠时（连发 tag）
    # 两个 brew job 并发 push 会 non-fast-forward 必挂其一；排队
    # 而非取消（cancel-in-progress: false），后者等前者推完再推。
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    # formula 与 cask 都是纯 mac 产物（CLI tar.gz 与 DMG 皆 build-osx
    # 产出），needs 只挂 build-osx。always() 保证上游失败也来试；
    # gate 一律硬拦（exit 1）——warning 跳过会静默漏发（v0.10.53
    # formula 漏发即此因）；产物缺失属真故障，红了可见，re-run 即恢复。
    needs: [create-release, build-osx, check-precondition]
    if: always()
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Gate on CLI tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/yomi-${VERSION}-aarch64-apple-darwin.tar.gz"
          # asset 刚上传存在秒级 404 窗口/瞬时网络抖动：重试后再判缺失
          found=false
          for i in 1 2 3 4 5; do
            curl -fsI "$url" >/dev/null && { found=true; break; }
            sleep 15
          done
          if [ "$found" = false ]; then
            echo "::error::missing release asset: $url"
            echo "❌ formula 依赖的 tarball 未就位（上游构建未完成或失败）；构建修复后 re-run 本 job 即恢复" >&2
            exit 1
          fi

      # 两个 gate 都在任何 tap push 之前：DMG 缺失时 fail 不会留下
      # formula 已推、cask 未推的中间态。
      - name: Download DMG from Release
        id: dmg
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Yomi_${VERSION}_aarch64.dmg"
          # asset 刚上传存在秒级 404 窗口/瞬时网络抖动：重试后再判缺失
          for i in 1 2 3 4 5; do
            curl -fsL -o Yomi.dmg "$DMG_URL" && break
            [ "$i" = 5 ] && { echo "::error::DMG not on release (macOS build failed or still uploading); re-run after it lands"; exit 1; }
            sleep 15
          done
          echo "DMG_SHA256=$(sha256sum Yomi.dmg | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Release CLI formula to Homebrew
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          bash ./scripts/brew-release.sh "${GITHUB_REF_NAME#v}"

      - name: Release GUI cask to Homebrew
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          bash ./scripts/brew-cask-release-ci.sh "${GITHUB_REF_NAME#v}" "$DMG_SHA256"
