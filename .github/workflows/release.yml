name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ==================== 前置检查 ====================
  check-precondition:
    name: Check Precondition
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check HOMEBREW_TAP_TOKEN
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "❌ ERROR: HOMEBREW_TAP_TOKEN is not set!" >&2
            echo "  Please add it to Repository secrets at: Settings → Secrets and variables → Actions → Repository secrets" >&2
            exit 1
          fi
          echo "✅ HOMEBREW_TAP_TOKEN is set (length: ${#HOMEBREW_TAP_TOKEN})"

  # ==================== TUI 构建 ====================
  build-tui:
    name: Build TUI ${{ matrix.target }}
    needs: check-precondition
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

          - target: aarch64-apple-darwin
            os: macos-latest

          # ✅ Windows（关键：msvc）
          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Linux 用 clang 避坑 aws-lc
      - name: Install clang (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            CC=clang CXX=clang++ cargo build --release --target ${{ matrix.target }} --bin yomi
          else
            cargo build --release --target ${{ matrix.target }} --bin yomi
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          VERSION=${GITHUB_REF_NAME#v}
          NAME=yomi

          BIN="target/${{ matrix.target }}/release/$NAME"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            BIN="${BIN}.exe"
          fi

          OUT="${NAME}-${VERSION}-${{ matrix.target }}"
          mkdir -p "$OUT"
          cp "$BIN" "$OUT/"

          tar czf "$OUT.tar.gz" "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz

  # ==================== GUI 构建 (macOS DMG) ====================
  build-gui:
    name: Build GUI (macOS)
    needs: check-precondition
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Sign DMG
        working-directory: crates/gui
        run: |
          cd frontend && npm install
          cd .. && npm install
          npx tauri build
          bash ../../scripts/fix-dmg-signature.sh

      - name: Calculate SHA256
        id: sha
        run: |
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: gui-dmg
          path: ${{ steps.sha.outputs.dmg }}

  # ==================== 创建 GitHub Release ====================
  release:
    needs: [build-tui, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**

  # ==================== 更新 Homebrew Formula (TUI) ====================
  brew-tui:
    needs: [release, check-precondition]
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Release TUI to Homebrew
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          bash ./scripts/brew-release.sh "${GITHUB_REF_NAME#v}"

  # ==================== 更新 Homebrew Cask (GUI) ====================
  brew-gui:
    needs: [release, check-precondition, brew-tui]
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download DMG from Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Yomi_${VERSION}_aarch64.dmg"
          curl -fsL -o Yomi.dmg "$DMG_URL"
          echo "DMG_SHA256=$(sha256sum Yomi.dmg | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Release GUI to Homebrew
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          bash ./scripts/brew-cask-release-ci.sh "${GITHUB_REF_NAME#v}" "$DMG_SHA256"
