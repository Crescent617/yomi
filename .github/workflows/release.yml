name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ==================== 前置检查 ====================
  check-precondition:
    name: Check Precondition
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check HOMEBREW_TAP_TOKEN
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "❌ ERROR: HOMEBREW_TAP_TOKEN is not set!" >&2
            echo "  Please add it to Repository secrets at: Settings → Secrets and variables → Actions → Repository secrets" >&2
            exit 1
          fi
          echo "✅ HOMEBREW_TAP_TOKEN is set (length: ${#HOMEBREW_TAP_TOKEN})"

  # ==================== 先行创建 Release ====================
  # 各构建 job 完成后随即向此 release 上架自己的产物（即建即发：
  # mac 编译完不用等 Windows）；缺失产物由 audit 收尾标注。
  create-release:
    name: Create Release
    needs: check-precondition
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # 从 CHANGELOG.md 抽取本版本 section 作为 GitHub Release 的 release note
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: bash ./scripts/extract-release-notes.sh "${GITHUB_REF_NAME#v}" release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md

  # ==================== TUI 构建 ====================
  build-tui:
    name: Build TUI ${{ matrix.target }}
    needs: [check-precondition, create-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      # 单平台 leg 失败不取消其他 leg——各产物独立构建。
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

          # macOS / Windows 的 CLI 资产已移入对应 GUI job——sidecar
          # 本来就要在那编一遍 CLI，同一 target dir 里 kernel 只编
          # 一次，资产与 sidecar 同源打包（此处不再重复全量编译）。

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Linux 用 clang 避坑 aws-lc
      - name: Install clang (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            CC=clang CXX=clang++ cargo build --release --target ${{ matrix.target }} --bin yomi
          else
            cargo build --release --target ${{ matrix.target }} --bin yomi
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          VERSION=${GITHUB_REF_NAME#v}
          NAME=yomi

          BIN="target/${{ matrix.target }}/release/$NAME"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            BIN="${BIN}.exe"
          fi

          OUT="${NAME}-${VERSION}-${{ matrix.target }}"
          mkdir -p "$OUT"
          cp "$BIN" "$OUT/"

          # Windows 产物打 zip（Windows 用户习惯；7z 是 runner 自带），
          # 其余平台保持 tar.gz。
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            7z a -tzip "$OUT.zip" "./$OUT" >/dev/null
          else
            tar czf "$OUT.tar.gz" "$OUT"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

      # 即建即发：本 leg 产物随即上架 release（softprops 按 tag 找
      # create-release 已建的 release 追加 asset，重传覆盖默认开启）。
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            yomi-*.tar.gz
            yomi-*.zip

  # ==================== GUI 构建 (macOS DMG) ====================
  build-gui:
    name: Build GUI (macOS)
    needs: [check-precondition, create-release]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            crates/gui/package-lock.json
            crates/gui/frontend/package-lock.json

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bundle CLI sidecar (externalBin)
        run: bash scripts/bundle-cli-sidecar.sh aarch64-apple-darwin

      # CLI tar.gz 与 sidecar 同源：同一 target dir 一次编译，此处
      # 只打包不上编译（原 build-tui macOS leg 的重复全量编译已删）。
      - name: Package & upload CLI asset
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          OUT="yomi-${VERSION}-aarch64-apple-darwin"
          mkdir -p "$OUT"
          cp target/release/yomi "$OUT/"
          tar czf "$OUT.tar.gz" "$OUT"

      - uses: actions/upload-artifact@v6
        with:
          name: aarch64-apple-darwin
          path: yomi-*-aarch64-apple-darwin.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          files: yomi-*-aarch64-apple-darwin.tar.gz

      - name: Build & Sign DMG
        working-directory: crates/gui
        run: |
          cd frontend && npm ci && cd ..
          # 根 npm ci 与前端构建并行；但 tauri build 必须等前端产物
          # 就绪——generate_context! 在 cargo codegen 时嵌入
          # frontendDist，暖缓存下先跑会把缺失/半成品的 build/ 打进
          # 签名 DMG；前端失败也在烧 rust 编译时间前快速退出。
          (cd frontend && npm run build) &
          FE_PID=$!
          npm ci
          wait $FE_PID || { echo "frontend build failed"; exit 1; }
          npx tauri build --config '{"build":{"beforeBuildCommand":""}}'
          bash ../../scripts/fix-dmg-signature.sh

      - name: Calculate SHA256
        id: sha
        run: |
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: gui-dmg
          path: ${{ steps.sha.outputs.dmg }}

      # 即建即发：DMG 随即上架（此时 Windows 产物可能还在构建）。
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sha.outputs.dmg }}

  # ==================== GUI 构建 (Windows MSI/NSIS) ====================
  # 与 windows-e2e.yml 的手动打包共用 .github/workflows/build-gui-windows.yml
  # 单一定义；产物经 release job 的 merge-multiple 下载随 Release 发布。
  build-gui-windows:
    name: Build GUI (Windows)
    needs: [check-precondition, create-release]
    uses: ./.github/workflows/build-gui-windows.yml

  # reusable 只负责构建（windows-e2e 共用，不该上架）；发布是
  # release.yml 的事——下载 artifact 随即上架。
  upload-gui-windows:
    name: Upload Windows installers to Release
    needs: [create-release, build-gui-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: gui-windows-installers
      # artifact 内是嵌套两层（upload-artifact 多 path 按 LCA 保留
      # 目录结构：msi/*.msi + nsis/*.exe）——必须递归通配，根目录
      # 通配会零匹配而 softprops 只 warn 不 fail（静默断供）。
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            **/Yomi_*.msi
            **/Yomi_*-setup.exe
            **/yomi-*-pc-windows-msvc.zip

  # ==================== Docker 镜像 (GHCR) ====================
  build-docker:
    name: Build & Push Docker Image
    # 复用 build-tui 的 linux 二进制直接打包，不再用 nix 从头编译（编译曾是本 job 的大头）
    # linux leg 失败（无 artifact）时跳过而非报错——不 block 其他产物发布。
    needs: [check-precondition, build-tui]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Download linux artifact
        id: dl
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: x86_64-unknown-linux-gnu

      - name: Skip when linux artifact missing
        if: steps.dl.outcome != 'success'
        run: echo "::warning::linux tui artifact missing (build leg failed); skipping docker image"

      - name: Prepare build context
        if: steps.dl.outcome == 'success'
        run: |
          set -euo pipefail
          tar xzf yomi-*-x86_64-unknown-linux-gnu.tar.gz
          cp yomi-*-x86_64-unknown-linux-gnu/yomi docker/yomi

          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${OWNER}/yomi" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        if: steps.dl.outcome == 'success'

      - name: Login to GHCR
        if: steps.dl.outcome == 'success'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: steps.dl.outcome == 'success'
        uses: docker/build-push-action@v6
        env:
          # 不上传 buildx 构建记录 artifact（0 字节、无法解 zip，
          # 会把 release job 的全量 artifact 下载搞挂）
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: docker
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          # apt 工具链层跨 run 缓存；yomi 层每次新发
          cache-from: type=gha,scope=yomi-docker
          cache-to: type=gha,mode=max,scope=yomi-docker

  # ==================== 收尾清点 ====================
  # 全部构建结束后清点 release 资产：缺失名单重写进 notes（从
  # CHANGELOG 重抽干净 notes 再追加——retry 补齐产物后 notes 自动
  # 恢复干净）。产物本身已由各构建 job 即建即发。
  audit:
    name: Audit release assets
    needs: [build-tui, build-gui, upload-gui-windows]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Report missing assets into release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          EXPECTED=(
            "yomi-${VERSION}-aarch64-apple-darwin.tar.gz"
            "yomi-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "yomi-${VERSION}-x86_64-pc-windows-msvc.zip"
            "Yomi_${VERSION}_aarch64.dmg"
            "Yomi_${VERSION}_x64_en-US.msi"
            "Yomi_${VERSION}_x64-setup.exe"
          )
          ASSETS=$(gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          MISSING=()
          for f in "${EXPECTED[@]}"; do
            if grep -qx "$f" <<< "$ASSETS"; then
              echo "present: $f"
            else
              echo "::warning::missing asset: $f"
              MISSING+=("$f")
            fi
          done
          bash ./scripts/extract-release-notes.sh "$VERSION" release-notes.md
          if [ ${#MISSING[@]} -gt 0 ]; then
            {
              echo ""
              echo "---"
              echo "⚠️ 本次发布缺少以下产物（对应构建 job 失败；修复后 re-run failed 会自动补齐并刷新本说明）："
              for f in "${MISSING[@]}"; do echo "- \`$f\`"; done
            } >> release-notes.md
          fi
          gh release edit "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --notes-file release-notes.md

  # ==================== 更新 Homebrew Formula (TUI) ====================
  brew-tui:
    # build-tui(linux) 与 build-gui(macOS CLI 资产与 sidecar 同源)
    # 完成后自行 gate：formula 需要 mac+linux 两个 tar.gz 都在
    # release 上；缺则跳过（不红）。
    needs: [create-release, build-tui, build-gui, check-precondition]
    if: always()
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Gate on tui assets
        id: gate
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ok=true
          for p in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/yomi-${VERSION}-${p}.tar.gz"
            # asset 刚上传存在秒级 404 窗口/瞬时网络抖动：重试后再判缺失
            found=false
            for i in 1 2 3 4 5; do
              curl -fsI "$url" >/dev/null && { found=true; break; }
              sleep 15
            done
            if [ "$found" = false ]; then
              echo "::warning::missing release asset: $url"
              ok=false
            fi
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Release TUI to Homebrew
        if: steps.gate.outputs.ok == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          bash ./scripts/brew-release.sh "${GITHUB_REF_NAME#v}"

  # ==================== 更新 Homebrew Cask (GUI) ====================
  brew-gui:
    # needs brew-tui 仅为串行 push 同一 tap repo（防 non-fast-forward
    # 冲突）；always() 使其在 brew-tui 失败/跳过时仍按 DMG gate 自行决定。
    needs: [create-release, build-gui, check-precondition, brew-tui]
    if: always()
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Download DMG from Release
        id: dmg
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Yomi_${VERSION}_aarch64.dmg"
          # asset 刚上传存在秒级 404 窗口/瞬时网络抖动：重试后再判缺失
          for i in 1 2 3 4 5; do
            curl -fsL -o Yomi.dmg "$DMG_URL" && break
            [ "$i" = 5 ] && exit 1
            sleep 15
          done
          echo "DMG_SHA256=$(sha256sum Yomi.dmg | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Skip when DMG missing
        if: steps.dmg.outcome != 'success'
        run: echo "::warning::DMG not on release (macOS build failed); skipping cask update"

      - name: Release GUI to Homebrew
        if: steps.dmg.outcome == 'success'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          bash ./scripts/brew-cask-release-ci.sh "${GITHUB_REF_NAME#v}" "$DMG_SHA256"
