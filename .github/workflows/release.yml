name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ==================== 前置检查 ====================
  check-precondition:
    name: Check Precondition
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check HOMEBREW_TAP_TOKEN
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "❌ ERROR: HOMEBREW_TAP_TOKEN is not set!" >&2
            echo "  Please add it to Repository secrets at: Settings → Secrets and variables → Actions → Repository secrets" >&2
            exit 1
          fi
          echo "✅ HOMEBREW_TAP_TOKEN is set (length: ${#HOMEBREW_TAP_TOKEN})"

  # ==================== TUI 构建 ====================
  build-tui:
    name: Build TUI ${{ matrix.target }}
    needs: check-precondition
    runs-on: ${{ matrix.os }}

    strategy:
      # 单平台 leg 失败不取消其他 leg——各产物独立构建。
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

          - target: aarch64-apple-darwin
            os: macos-latest

          # ✅ Windows（关键：msvc）
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Linux 用 clang 避坑 aws-lc
      - name: Install clang (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            CC=clang CXX=clang++ cargo build --release --target ${{ matrix.target }} --bin yomi
          else
            cargo build --release --target ${{ matrix.target }} --bin yomi
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          VERSION=${GITHUB_REF_NAME#v}
          NAME=yomi

          BIN="target/${{ matrix.target }}/release/$NAME"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            BIN="${BIN}.exe"
          fi

          OUT="${NAME}-${VERSION}-${{ matrix.target }}"
          mkdir -p "$OUT"
          cp "$BIN" "$OUT/"

          # Windows 产物打 zip（Windows 用户习惯；7z 是 runner 自带），
          # 其余平台保持 tar.gz。
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            7z a -tzip "$OUT.zip" "./$OUT" >/dev/null
          else
            tar czf "$OUT.tar.gz" "$OUT"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  # ==================== GUI 构建 (macOS DMG) ====================
  build-gui:
    name: Build GUI (macOS)
    needs: check-precondition
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            crates/gui/package-lock.json
            crates/gui/frontend/package-lock.json

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Sign DMG
        working-directory: crates/gui
        run: |
          cd frontend && npm ci && cd ..
          # 根 npm ci 与前端构建并行；但 tauri build 必须等前端产物
          # 就绪——generate_context! 在 cargo codegen 时嵌入
          # frontendDist，暖缓存下先跑会把缺失/半成品的 build/ 打进
          # 签名 DMG；前端失败也在烧 rust 编译时间前快速退出。
          (cd frontend && npm run build) &
          FE_PID=$!
          npm ci
          wait $FE_PID || { echo "frontend build failed"; exit 1; }
          npx tauri build --config '{"build":{"beforeBuildCommand":""}}'
          bash ../../scripts/fix-dmg-signature.sh

      - name: Calculate SHA256
        id: sha
        run: |
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$DMG" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: gui-dmg
          path: ${{ steps.sha.outputs.dmg }}

  # ==================== GUI 构建 (Windows MSI/NSIS) ====================
  # 与 windows-e2e.yml 的手动打包共用 .github/workflows/build-gui-windows.yml
  # 单一定义；产物经 release job 的 merge-multiple 下载随 Release 发布。
  build-gui-windows:
    name: Build GUI (Windows)
    needs: check-precondition
    uses: ./.github/workflows/build-gui-windows.yml

  # ==================== Docker 镜像 (GHCR) ====================
  build-docker:
    name: Build & Push Docker Image
    # 复用 build-tui 的 linux 二进制直接打包，不再用 nix 从头编译（编译曾是本 job 的大头）
    # linux leg 失败（无 artifact）时跳过而非报错——不 block 其他产物发布。
    needs: [check-precondition, build-tui]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Download linux artifact
        id: dl
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: x86_64-unknown-linux-gnu

      - name: Skip when linux artifact missing
        if: steps.dl.outcome != 'success'
        run: echo "::warning::linux tui artifact missing (build leg failed); skipping docker image"

      - name: Prepare build context
        if: steps.dl.outcome == 'success'
        run: |
          set -euo pipefail
          tar xzf yomi-*-x86_64-unknown-linux-gnu.tar.gz
          cp yomi-*-x86_64-unknown-linux-gnu/yomi docker/yomi

          VERSION="${GITHUB_REF_NAME#v}"
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${OWNER}/yomi" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        if: steps.dl.outcome == 'success'

      - name: Login to GHCR
        if: steps.dl.outcome == 'success'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        if: steps.dl.outcome == 'success'
        uses: docker/build-push-action@v6
        env:
          # 不上传 buildx 构建记录 artifact（0 字节、无法解 zip，
          # 会把 release job 的全量 artifact 下载搞挂）
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: docker
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          # apt 工具链层跨 run 缓存；yomi 层每次新发
          cache-from: type=gha,scope=yomi-docker
          cache-to: type=gha,mode=max,scope=yomi-docker

  # ==================== 创建 GitHub Release ====================
  release:
    needs: [build-tui, build-gui, build-gui-windows]
    # 任一构建 job 失败仍发布存在的产物（缺失产物在 notes 尾部列
    # 出）；全部构建失败则无产物可发，Detect 步骤会 exit 1 中止。
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 产物存在性输出，供下游 brew job 决定跑还是跳过（job 级 if，
    # 缺失时显示 skipped 而非失败）。
    outputs:
      has_tui_mac: ${{ steps.detect.outputs.has_tui_mac }}
      has_tui_linux: ${{ steps.detect.outputs.has_tui_linux }}
      has_dmg: ${{ steps.detect.outputs.has_dmg }}

    steps:
      - uses: actions/checkout@v6

      # 从 CHANGELOG.md 抽取本版本 section 作为 GitHub Release 的 release note
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" ver "]") == 1) found=1
              next
            }
            found && !started && /^[[:space:]]*$/ { next }
            found { started=1; out = out $0 "\n" }
            END { sub(/\n+$/, "", out); if (out != "") print out }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md 中未找到 [${VERSION}] 的条目，Release 将没有 release note"
          fi
          cat release-notes.md

      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      # 清点产物：存在性写 outputs（供 brew 下游），缺失名单追加进
      # release notes；全灭则中止发布（空 release 无意义）。
      # 产物文件名假设 tag 版本与 crates/gui/tauri.conf.json 同步
      # （bump-version.py 保证，与 brew-cask 脚本同一假设）。
      - name: Detect missing artifacts
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          declare -A EXPECTED=(
            [has_tui_mac]="yomi-${VERSION}-aarch64-apple-darwin.tar.gz"
            [has_tui_linux]="yomi-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            [has_tui_win]="yomi-${VERSION}-x86_64-pc-windows-msvc.zip"
            [has_dmg]="Yomi_${VERSION}_aarch64.dmg"
            [has_win_msi]="Yomi_${VERSION}_x64_en-US.msi"
            [has_win_nsis]="Yomi_${VERSION}_x64-setup.exe"
          )
          MISSING=()
          for key in "${!EXPECTED[@]}"; do
            f="${EXPECTED[$key]}"
            if [ -f "artifacts/$f" ]; then
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${key}=false" >> "$GITHUB_OUTPUT"
              echo "::warning::missing artifact: $f"
              MISSING+=("$f")
            fi
          done
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::所有构建产物均缺失，中止发布"
            exit 1
          fi
          if [ ${#MISSING[@]} -gt 0 ]; then
            {
              echo ""
              echo "---"
              echo "⚠️ 本次发布缺少以下产物（对应构建 job 失败；修复后可重新发版）："
              for f in "${MISSING[@]}"; do echo "- \`$f\`"; done
            } >> release-notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          body_path: release-notes.md

  # ==================== 更新 Homebrew Formula (TUI) ====================
  brew-tui:
    needs: [release, check-precondition]
    # formula 需要 mac+linux 两个 tar.gz；缺失则跳过（skipped）而非失败。
    # release 自身失败（如上传挂）时 asset 不在，同样跳过。
    if: always() && needs.release.result == 'success' && needs.release.outputs.has_tui_mac == 'true' && needs.release.outputs.has_tui_linux == 'true'
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Release TUI to Homebrew
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          bash ./scripts/brew-release.sh "${GITHUB_REF_NAME#v}"

  # ==================== 更新 Homebrew Cask (GUI) ====================
  brew-gui:
    # needs brew-tui 仅为串行 push 同一 tap repo（防 non-fast-forward
    # 冲突）；always() 使其在 brew-tui 失败/跳过时仍按 DMG 存在性自行决定。
    needs: [release, check-precondition, brew-tui]
    if: always() && needs.release.result == 'success' && needs.release.outputs.has_dmg == 'true'
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Download DMG from Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Yomi_${VERSION}_aarch64.dmg"
          curl -fsL -o Yomi.dmg "$DMG_URL"
          echo "DMG_SHA256=$(sha256sum Yomi.dmg | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Release GUI to Homebrew
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          bash ./scripts/brew-cask-release-ci.sh "${GITHUB_REF_NAME#v}" "$DMG_SHA256"
