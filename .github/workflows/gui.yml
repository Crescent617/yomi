name: GUI

on:
  push:
    branches: [main]
    paths:
      - "crates/gui/**"
      - "crates/kernel/**"
      - "shell.nix"
      - ".github/workflows/gui.yml"
  pull_request:
    paths:
      - "crates/gui/**"
      - "crates/kernel/**"
      - "shell.nix"
      - ".github/workflows/gui.yml"

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: crates/gui/frontend/package-lock.json

      - name: Install frontend deps
        run: cd crates/gui/frontend && npm ci

      - name: Build frontend
        run: cd crates/gui/frontend && npm run build

      - name: Check formatting
        run: cd crates/gui/frontend && npx prettier --check src || true

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libssl-dev libappindicator3-dev librsvg2-dev

      - name: Check GUI crate
        run: cargo check -p yomi-gui

      - name: Clippy
        run: cargo clippy -p yomi-gui -- -D warnings

      - name: Format check
        run: cargo fmt -p yomi-gui -- --check

  build-full:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: crates/gui/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libssl-dev libappindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: cd crates/gui/frontend && npm ci

      - name: Build frontend
        run: cd crates/gui/frontend && npm run build

      - name: Build release binary
        run: cargo build --release -p yomi-gui

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: yomi-gui-linux-x64
          path: target/release/yomi-gui
