# 可复用 workflow：Windows GUI (tauri) 打包，产出 msi artifact（nsis 已砍，
# 只保留功能更强的 msi：PATH 写入/企业静默部署都走它）。
# 两个消费面共用此单一定义，避免漂移：
#   - release.yml：tag 发版时构建，产物随 GitHub Release 发布
#   - windows-e2e.yml：手动触发，不发版验证打包（修复后预演）
# 产物无 Authenticode 签名（SmartScreen 会提示，按需后续补签名）。

name: build-windows

on:
  workflow_call:
    inputs:
      release-upload:
        description: >-
          构建成功后直接把 msi 与 CLI zip 上架到当前 tag 的 GitHub
          Release（即建即发）。仅 release.yml 发版时开启；
          windows-e2e 验证打包不传，产物只留 artifact。
        type: boolean
        default: false
  workflow_dispatch:  # 手动验证 Windows GUI 编译（main 直推无 CI 门禁）

jobs:
  build:
    name: msi
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            crates/gui/package-lock.json
            crates/gui/frontend/package-lock.json

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # frontend（node/vite）与 CLI 编译（cargo）后台并行，产物目
      # 录不相交；tauri codegen 嵌入 frontendDist 前必须 wait 就绪。
      - name: Build CLI sidecar + frontend (concurrent)
        shell: bash
        run: |
          set -euo pipefail
          (cd crates/gui/frontend && npm ci && npm run build) &
          FE_PID=$!
          bash scripts/bundle-cli-sidecar.sh x86_64-pc-windows-msvc
          wait $FE_PID || { echo "frontend build failed"; exit 1; }

      # CLI zip 与 sidecar 同源（同一 target dir 一次编译）——版本号
      # 读 tauri.conf.json：reusable 在 tag（release.yml）与分支
      #（windows-e2e dispatch）两种 ref 下都取得到。
      - name: Package CLI zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oE '"version":\s*"[^"]+"' crates/gui/tauri.conf.json | head -1 | cut -d'"' -f4)
          OUT="yomi-${VERSION}-x86_64-pc-windows-msvc"
          mkdir -p "$OUT"
          cp target/release/yomi.exe "$OUT/"
          7z a -tzip "$OUT.zip" "./$OUT" >/dev/null

      - name: Build frontend + tauri (msi)
        working-directory: crates/gui
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tauri build --config '{"build":{"beforeBuildCommand":""}}'

      # 回归守卫：windows_subsystem 属性一旦失效（例如少写 `!` 变成 outer attr，
      # rustc 仅 warning），exe 会退回 CUI、用户启动即弹控制台窗口。直接读 PE 头断言。
      - name: Verify GUI exe is windows-subsystem
        shell: pwsh
        run: |
          $path = "target/release/yomi-gui.exe"
          $fs = [System.IO.File]::OpenRead($path)
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Seek(0x3c, [System.IO.SeekOrigin]::Begin) | Out-Null
          $pe = $br.ReadInt32()
          $fs.Seek($pe + 0x5c, [System.IO.SeekOrigin]::Begin) | Out-Null
          $sub = $br.ReadUInt16()
          $br.Close()
          if ($sub -ne 2) { throw "yomi-gui.exe subsystem=$sub, expect 2 (Windows GUI); CUI exe pops a console window on launch" }
          Write-Host "yomi-gui.exe subsystem=$sub OK"

      # wix 中间产物（渲染后的 main.wxs + .wixobj）：light 报错被 tauri
      # 吞 stderr 时（2026-09-26 前科），下载此 artifact 进 VM 真跑
      # candle/light 拿真实错误码。
      - name: Upload wix intermediates on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: wix-intermediates
          path: target/release/wix/

      # tauri 把 light.exe 的 stderr 吞成一句 "failed to run light.exe"，
      # ICE/LGHT 错误码不可见。失败时在 runner 上原样重跑一遍 light，
      # 完整输出留在 job log。
      - name: Rerun light with visible output
        if: failure()
        shell: pwsh
        working-directory: target/release/wix/x64
        run: |
          $wix = "$env:LOCALAPPDATA\tauri\WixTools314"
          & "$wix\light.exe" -ext WixUIExtension -ext WixUtilExtension `
            -o repro.msi -cultures:en-us -loc locale.wxl *.wixobj | Out-String -Width 300

      - uses: actions/upload-artifact@v6
        with:
          name: gui-windows-installers
          # bundle 产物在 workspace 根 target/（cargo 共享 target dir），
          # 与 macOS DMG 的 sha/upload 路径同惯例。
          path: |
            target/release/bundle/msi/*.msi
            yomi-*-x86_64-pc-windows-msvc.zip

      # 即建即发（release.yml 传 release-upload: true 时）：msi 与
      # CLI zip 直接上架当前 tag 的 release，不再由 release.yml 聚合
      # 下载转发——省一整圈 artifact 下载+上传，Windows 编译完即
      # 可发布，不等任何其他 job。需要调用方 job 给 contents: write。
      - name: Upload installers to Release
        if: inputs.release-upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            yomi-*-x86_64-pc-windows-msvc.zip
