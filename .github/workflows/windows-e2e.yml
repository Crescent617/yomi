# Windows e2e —— 手动触发的一次性验证（不进常驻 CI 矩阵）。
# 用途：kernel 在真 Windows 上的编译 + 测试（cfg(windows) 代码、
# Windows 实机 e2e 测试）；触发方式：Actions 页面手动 Run workflow
# 或 `gh workflow run windows-e2e.yml`。

name: windows-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-test:
    name: kernel tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # feishu feature 的 lark-websocket-protobuf 构建需要 protoc
      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-e2e-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Environment probe
        shell: cmd
        run: |
          where bash.exe || echo "bash.exe not in PATH"
          where pwsh.exe || echo "pwsh.exe not in PATH"
          where powershell.exe
          where cmd.exe

      - name: cargo test (kernel lib)
        run: cargo test -p kernel --lib --locked

      - name: cargo check (cli + tui)
        run: cargo check -p cli -p tui --locked

      # 与 release.yml 的 Windows 产物构建同款命令：发版前在真机上
      # 验证 release profile 可构建（opt 路径与 dev 有差，曾踩过
      # profile 相关的平台坑）。
      - name: cargo build --release (yomi.exe, release 产物预演)
        run: cargo build --release --target x86_64-pc-windows-msvc --bin yomi --locked

  # Windows GUI 手动打包验证入口（不发版）。正式构建在 release.yml；
  # 两侧共用 .github/workflows/build-windows.yml 单一定义。
  gui-build:
    name: Build GUI (Windows)
    uses: ./.github/workflows/build-windows.yml

  # MSI 无头装-验-卸（per-user 包的端到端守门；本地 win11 VM 随
  # qemu/macOS 升级已不可 boot，runner 就是真 Windows 且可重复）。
  msi-e2e:
    name: msi install e2e
    runs-on: windows-latest
    needs: gui-build
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: gui-windows-installers
          path: dist

      - name: Install / verify / uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem dist/*.msi | Select-Object -First 1
          $dir = "$env:LOCALAPPDATA\Programs\Yomi"

          # 装（per-user 免管理员静默装；exit 0 即第一重断言）。
          # 用调用操作符而非 Start-Process -ArgumentList：后者对嵌入
          # 引号的参数重组有前科，这次把 /i 值拼丢成空串（msiexec
          # 1619）。
          & msiexec.exe /i "$($msi.FullName)" /qn /norestart /l*v "$env:TEMP\msi-e2e-install.log" | Out-Null
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:TEMP\msi-e2e-install.log" -Tail 40; throw "install exit=$LASTEXITCODE" }

          # 验：落点、sidecar、HKCU 卸载项、用户 PATH、CLI 可跑
          function Should-BeTrue($cond, $what) { if (-not $cond) { throw "check failed: $what" } }
          Should-BeTrue (Test-Path "$dir\yomi-gui.exe") 'yomi-gui.exe present'
          Should-BeTrue (Test-Path "$dir\yomi.exe") 'sidecar yomi.exe present'
          $prod = Get-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -like '*Yomi*' } | Select-Object -First 1
          Should-BeTrue ($null -ne $prod) 'HKCU uninstall entry'
          Should-BeTrue (((Get-ItemProperty 'HKCU:\Environment').Path) -like "*$dir*") 'user PATH contains dir'
          $v = & "$dir\yomi.exe" --version
          Should-BeTrue ("$v" -match 'yomi 0\.') "yomi --version => $v"

          # 卸 + 清理干净
          & msiexec.exe /x "$($prod.PSChildName)" /qn /norestart | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "uninstall exit=$LASTEXITCODE" }
          Should-BeTrue (-not (Test-Path $dir)) 'dir removed'
          Should-BeTrue (-not (((Get-ItemProperty 'HKCU:\Environment').Path) -like "*$dir*")) 'user PATH cleaned'
