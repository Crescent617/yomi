# Windows e2e —— 手动触发的一次性验证（不进常驻 CI 矩阵）。
# 用途：kernel 在真 Windows 上的编译 + 测试（cfg(windows) 代码、
# Windows 实机 e2e 测试）；触发方式：Actions 页面手动 Run workflow
# 或 `gh workflow run windows-e2e.yml`。

name: windows-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-test:
    name: kernel tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # feishu feature 的 lark-websocket-protobuf 构建需要 protoc
      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-e2e-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Environment probe
        shell: cmd
        run: |
          where bash.exe || echo "bash.exe not in PATH"
          where pwsh.exe || echo "pwsh.exe not in PATH"
          where powershell.exe
          where cmd.exe

      - name: cargo test (kernel lib)
        run: cargo test -p kernel --lib --locked

      - name: cargo check (cli + tui)
        run: cargo check -p cli -p tui --locked

      # 与 release.yml 的 Windows 产物构建同款命令：发版前在真机上
      # 验证 release profile 可构建（opt 路径与 dev 有差，曾踩过
      # profile 相关的平台坑）。
      - name: cargo build --release (yomi.exe, release 产物预演)
        run: cargo build --release --target x86_64-pc-windows-msvc --bin yomi --locked

  # Windows GUI 打包验证（2026-09-11 hrli 要实物安装包测试）。验证
  # 通过后此 job 移植进 release.yml 正式发版；产物无 Authenticode
  # 签名（SmartScreen 会提示，测试场景可接受）。
  gui-build:
    name: Build GUI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            crates/gui/package-lock.json
            crates/gui/frontend/package-lock.json

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Build frontend + tauri (msi + nsis)
        working-directory: crates/gui
        shell: bash
        run: |
          set -euo pipefail
          cd frontend && npm ci && npm run build && cd ..
          npm ci
          npx tauri build --config '{"build":{"beforeBuildCommand":""}}'

      - uses: actions/upload-artifact@v4
        with:
          name: gui-windows-installers
          # bundle 产物在 workspace 根 target/（cargo 共享 target dir），
          # 与 macOS DMG 的 sha/upload 路径同惯例。
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
